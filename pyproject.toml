[project]
name = "anndata-tutorial"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Dirk Hermans", email = "hermans.dirk@hotmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "anndata>=0.10.9",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pyranges>=0.1.4",
    "scanpy>=1.10.3",
]

[project.scripts]
anndata-tutorial = "anndata_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
]
